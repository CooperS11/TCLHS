<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tclhs — Student Home</title>
  <link rel="stylesheet" href="theme.css"/>
  <script src="authentication.js"></script>
  <style>
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-accepted { background: #d1e7dd; color: #0a3622; }
    .badge-rejected { background: #f8d7da; color: #58151c; }
  </style>
</head>
<body class="dash-page">

  <header class="dash-header">
    <a href="index.html" class="logo">tclhs</a>
    <nav>
      <a href="browse-tutors.html">Browse Tutors</a>
      <a href="#" id="switch-home-link" style="display:none;">Tutor Home</a>
      <a href="student-home.html" class="active">My Tutors</a>
      <a href="account-settings.html">Account</a>
      <a href="#" onclick="signOut(event)">Log out</a>
    </nav>
  </header>

  <main class="dash-main">
    <h1 class="page-title">student home page</h1>

    <div class="flex items-center gap-2 mb-3">
      <img
        id="profilePic"
        src="https://via.placeholder.com/90"
        alt="Profile photo"
        class="avatar"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />
      <div id="avatarPlaceholder" class="avatar-placeholder" style="display:none;">&#128100;</div>
      <div>
        <div id="studentName" class="font-bold">[Student Name]</div>
        <div id="gradeLevel" class="text-sm text-muted">Grade [X]</div>
        <div id="pronouns" class="text-sm text-muted"></div>
        <div id="bio" class="text-sm text-muted"></div>
        <div id="subjects" class="text-sm text-muted"></div>
      </div>
    </div>

    <div class="card">
      <table class="data-table" id="tutors-table">
        <thead>
          <tr>
            <th>Tutor</th>
            <th>Details</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tutors-tbody">
          <tr id="links-loading-row">
            <td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">Loading…</td>
          </tr>
        </tbody>
      </table>

      <div class="mt-2">
        <a href="browse-tutors.html" class="link">+ ADD MORE</a>
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      Auth.requireRole(['student', 'both']);
      const switchLink = document.getElementById('switch-home-link');
      if (Auth.hasTutorProfile() && switchLink) {
        switchLink.style.display = 'inline-block';
        switchLink.href = 'tutor-home.html';
      }
      const userId = Auth.getUserId();
      if (!userId) return;
      loadProfileData(userId);
      loadLinks(userId);
    });

    function signOut(event) {
      if (event) event.preventDefault();
      Auth.signOut();
    }

    async function loadProfileData(userId) {
      try {
        const res = await fetch('/api/account/' + userId);
        if (!res.ok) return;
        const account = await res.json();

        const profilePicEl = document.getElementById('profilePic');
        if (account.profilePic) {
          profilePicEl.src = account.profilePic;
          profilePicEl.style.display = 'block';
          document.getElementById('avatarPlaceholder').style.display = 'none';
        } else {
          profilePicEl.style.display = 'none';
          document.getElementById('avatarPlaceholder').style.display = 'flex';
        }

        document.getElementById('studentName').textContent = account.name || '[Student Name]';
        document.getElementById('gradeLevel').textContent  = 'Grade ' + (account.gradeLevel || '[X]');
        document.getElementById('pronouns').textContent    = account.pronouns || '';
        document.getElementById('bio').textContent         = account.bio ? '"' + account.bio + '"' : '';
        document.getElementById('subjects').textContent    = account.subjects ? account.subjects.join(', ') : '';
      } catch (err) {
        console.error('Error loading profile:', err);
      }
    }

    async function loadLinks(userId) {
      const tbody = document.getElementById('tutors-tbody');
      try {
        const res = await fetch('/api/links/student/' + userId);
        if (!res.ok) throw new Error('Failed to load');
        const links = await res.json();

        if (!links || links.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">No tutors yet. <a href="browse-tutors.html" class="link">Browse tutors</a> to get started.</td></tr>';
          return;
        }

        tbody.innerHTML = links.map(l => {
          const status     = l.status || 'pending';
          const badgeCls   = 'badge-' + status;
          const tutorName  = escHtml(l.tutorName || 'Unknown Tutor');
          const details    = escHtml(l.details   || '—');
          return `
            <tr data-link-id="${l.id}">
              <td>${tutorName}</td>
              <td style="color:var(--text-muted); font-size:0.85rem;">${details}</td>
              <td><span class="badge ${badgeCls}">${status}</span></td>
              <td><a href="view-link.html?id=${l.id}" class="btn btn-sm btn-outline">View</a></td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">Could not load connections.</td></tr>';
        console.error(err);
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
