<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tclhs — Tutor Home</title>
  <link rel="stylesheet" href="theme.css"/>
  <script src="authentication.js"></script>
  <style>
    .tutor-grid {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 1.5rem;
      align-items: start;
    }
    .tutor-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .aura-display { font-size: 2rem; line-height: 1; }
    .aura-count   { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    .request-card {
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .request-card + .request-card { margin-top: 0.75rem; }
    .request-meta { display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.875rem; color: var(--text-muted); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-accepted { background: #d1e7dd; color: #0a3622; }
    .badge-rejected { background: #f8d7da; color: #58151c; }
    @media (max-width: 640px) { .tutor-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="dash-page">

  <header class="dash-header">
    <a href="index.html" class="logo">tclhs</a>
    <nav>
      <a href="tutor-home.html" class="active">My Profile</a>
      <a href="tutor-setup.html?edit=true">Edit Profile</a>
      <a href="#" id="switch-home-link" style="display:none;">Student Home</a>
      <a href="account-settings.html">Account</a>
      <a href="#" onclick="Auth.signOut()">Log out</a>
    </nav>
  </header>

  <main class="dash-main">
    <h1 class="page-title">tutor home page</h1>

    <div class="card">
      <div class="tutor-grid">

        <!-- ── Left: profile photo + bio ── -->
        <div class="flex flex-col items-center gap-2" style="text-align:center;">
          <img
            src="https://via.placeholder.com/90"
            alt="Profile photo"
            class="avatar"
            data-field="profilePhoto"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="avatar-placeholder" style="display:none;">&#128100;</div>
          <div style="margin-top:0.5rem; text-align:left;">
            <div class="tutor-section-label">Bio</div>
            <p class="text-sm" data-field="bio" id="bio-text">[Tutor bio goes here]</p>
          </div>
        </div>

        <!-- ── Center: subjects + availability ── -->
        <div style="display:flex; flex-direction:column; gap:1.25rem;">
          <div>
            <div class="tutor-section-label">Subjects</div>
            <p data-field="subjects" id="subjects-text">[Subject 1, Subject 2, Subject 3]</p>
          </div>
          <div>
            <div class="tutor-section-label">Availability</div>
            <p data-field="availability" id="availability-text">[No current availability]</p>
          </div>
        </div>

        <!-- ── Right: aura ── -->
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:1rem; min-width:140px;">
          <div style="text-align:right;">
            <div class="aura-display" id="aura-display" data-field="aura">✨ 0</div>
            <div class="aura-count" data-field="auraCount">aura</div>
          </div>
        </div>

      </div>
    </div>

    <!-- ── My Students ──────────────────────────────────────── -->
    <section style="margin-top:2rem;">
      <h2 class="page-title" style="margin-bottom:1rem;">My Students</h2>
      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Details</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="students-tbody">
            <tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      Auth.requireRole(['tutor', 'both']);
      const switchLink = document.getElementById('switch-home-link');
      if (Auth.hasTutorProfile() && switchLink) {
        switchLink.style.display = 'inline-block';
        switchLink.href = 'student-home.html';
      }
      loadStudentLinks();
    });

    // Use stored tutorId (Tutors table id), fall back to accountId for profile lookup
    const tutorId   = Auth.getTutorId() || Auth.getUserId();

    async function loadStudentLinks() {
      if (!tutorId) return;
      const tbody = document.getElementById('students-tbody');
      try {
        const res = await fetch('/api/links/tutor/' + tutorId);
        if (!res.ok) throw new Error();
        const links = await res.json();
        if (!links || links.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">No student connections yet.</td></tr>';
          return;
        }
        tbody.innerHTML = links.map(l => `
          <tr>
            <td>${escHtml(l.studentName || 'Student')}</td>
            <td style="color:var(--text-muted); font-size:0.85rem;">${escHtml(l.details || '—')}</td>
            <td><span class="badge badge-${l.status || 'pending'}">${l.status || 'pending'}</span></td>
            <td><a href="view-link.html?id=${l.id}&as=tutor" class="btn btn-sm btn-outline">View</a></td>
          </tr>
        `).join('');
      } catch {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:1.5rem;">Could not load connections.</td></tr>';
      }
    }

    async function refreshProfileAndRequests() {
      try {
        if (tutorId) {
          const p = await fetch('/api/tutor/' + tutorId).then(r => r.ok ? r.json() : null);
          if (p) populateTutorProfile(p);
          const links = await fetch('/api/links/tutor/' + tutorId).then(r => r.ok ? r.json() : []);
          requests.length = 0; // reuse structure
          links.forEach(l => { requests[l.id || l.requestId || (Date.now() + '-' + Math.random().toString(36).slice(2))] = l; });
          renderRequests();
          loadStudentLinks();
        }
      } catch (e) { console.error('Failed refreshing profile/requests', e); }
    }

    function formatAvailability(value) {
      if (!value) return null;
      let availability = value;
      if (typeof value === 'string') {
        try { availability = JSON.parse(value); } catch { return value; }
      }
      if (!availability || typeof availability !== 'object' || !availability.Dates) {
        return typeof value === 'string' ? value : null;
      }
      const dayOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
      const entries = Object.entries(availability.Dates)
        .filter(([, w]) => Array.isArray(w) && w.length > 0)
        .sort((a, b) => dayOrder.indexOf(a[0]) - dayOrder.indexOf(b[0]));
      if (!entries.length) return null;
      const fmt = h => {
        const hrs = Math.floor(h), m = Math.round((h - hrs) * 60);
        const p = hrs >= 12 ? 'pm' : 'am', h12 = hrs % 12 || 12;
        return m === 0 ? `${h12}${p}` : `${h12}:${m.toString().padStart(2,'0')}${p}`;
      };
      return entries.map(([day, ws]) => {
        const r = ws.filter(Array.isArray).map(([s, e]) => `${fmt(s)}–${fmt(e)}`).join(', ');
        return r ? `${day}: ${r}` : null;
      }).filter(Boolean).join('; ');
    }

    function populateTutorProfile(tutor) {
      document.querySelector('[data-field="profilePhoto"]').src = tutor.profilePhotoUrl || '';
      document.getElementById('bio-text').textContent      = tutor.bio || '';
      document.getElementById('subjects-text').textContent = (tutor.courses || []).join(', ');
      const availText = formatAvailability(tutor.availability) || 'No current availability';
      document.getElementById('availability-text').textContent = availText;
      document.getElementById('aura-display').textContent = '✨ ' + (tutor.rating ? Math.round(tutor.rating * 200) : 0);
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
