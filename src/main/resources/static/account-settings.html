<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tclhs — Account Settings</title>
  <link rel="stylesheet" href="theme.css"/>
  <script src="authentication.js"></script>
  <style>
    .settings-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-success { background: #1a3a2a; color: #6ee7a0; border: 1px solid #2a5a3e; }
    .alert-error   { background: #3a1a1a; color: #f87171; border: 1px solid #5a2a2a; }
    .avatar-upload-wrap { display: flex; align-items: center; gap: 1.5rem; }
    .type-toggle {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .type-toggle-btn {
      padding: 0.45rem 1.1rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 0.875rem;
      font-family: var(--font);
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
    }
    .type-toggle-btn:hover { border-color: var(--btn); color: var(--text); }
    .type-toggle-btn.active {
      border-color: var(--btn);
      background: rgba(224, 82, 82, 0.12);
      color: var(--btn);
    }

    .btn-danger {
      background: #d14343;
      color: white;
      border-color: transparent;
    }
    .btn-danger:hover { background: #a23232; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .modal-actions .btn { flex: 1; }

    @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="dash-page">

  <header class="dash-header">
    <a href="index.html" class="logo">tclhs</a>
    <nav>
      <!-- DATA: currentUser.role — updated by JS -->
      <a href="student-home.html" id="home-link">Home</a>
      <a href="account-settings.html" class="active">Account</a>
      <a href="#" onclick="Auth.signOut(); return false;">Log out</a>
    </nav>
  </header>

  <main class="dash-main">
    <h1 class="page-title">account settings</h1>

    <div id="alert-success" class="alert alert-success">Changes saved successfully.</div>
    <div id="alert-error"   class="alert alert-error">Something went wrong. Please try again.</div>

    <form id="account-form" action="/api/account/update" method="POST">

      <!-- ── Profile Photo ───────────────────────────────────── -->
      <div class="card mb-3">
        <div class="settings-section-title">Profile Photo</div>
        <div class="avatar-upload-wrap">
          <!-- DATA: user.profilePhotoUrl -->
          <img
            id="avatar-preview"
            src="https://via.placeholder.com/90"
            alt="Profile photo"
            class="avatar"
            data-field="profilePhoto"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="avatar-placeholder" style="display:none;">&#128100;</div>
          <div style="flex:1">
            <div class="form-group" style="margin-bottom:0;">
              <label for="profile-pic-url">Profile Picture URL</label>
              <input type="url" id="profile-pic-url" name="profilePicUrl" class="form-control"
                     placeholder="https://example.com/photo.jpg" oninput="updateAvatarPreview()"/>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Personal Info ──────────────────────────────────── -->
      <div class="card mb-3">
        <div class="settings-section-title">Personal Information</div>

        <div class="form-row">
          <!-- DATA: user.firstName -->
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="firstName" class="form-control"
                   placeholder="First name" data-field="firstName" required/>
          </div>
          <!-- DATA: user.lastName -->
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="lastName" class="form-control"
                   placeholder="Last name" data-field="lastName" required/>
          </div>
        </div>

        <!-- DATA: user.email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="@seattleschools.org" data-field="email" required/>
        </div>

        <!-- DATA: student.gradeLevel — hidden for tutors -->
        <div class="form-group" id="grade-level-group">
          <label for="grade-level">Grade Level</label>
          <select id="grade-level" name="gradeLevel" class="form-control" data-field="gradeLevel">
            <option value="">Select grade</option>
            <option value="9">9th Grade</option>
            <option value="10">10th Grade</option>
            <option value="11">11th Grade</option>
            <option value="12">12th Grade</option>
          </select>
        </div>
      </div>

      <!-- ── Change Password ─────────────────────────────────── -->
      <div class="card mb-3">
        <div class="settings-section-title">Change Password</div>

        <p class="text-sm text-muted" style="margin-bottom:1rem;">Use the button below to change your password.</p>
        <button type="button" class="btn btn-outline" onclick="openPasswordModal()">Change password</button>
      </div>

      <div class="flex gap-2 items-center" style="align-items:flex-start; flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary" style="width:auto; min-width:160px;">Save Changes</button>
        <button type="button" class="btn btn-danger" onclick="confirmDeleteAccount()">Delete Account</button>
      </div>

      <div id="password-modal" class="modal-overlay">
        <div class="modal-box">
          <div class="modal-title">Change password</div>
          <div class="form-group">
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" name="currentPassword" class="form-control"
                   placeholder="Current password" autocomplete="current-password"/>
          </div>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="newPassword" class="form-control"
                   placeholder="New password" autocomplete="new-password"/>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" name="confirmPassword" class="form-control"
                   placeholder="Confirm new password" autocomplete="new-password"/>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-primary" onclick="closePasswordModal()">Save Password</button>
            <button type="button" class="btn btn-outline" onclick="closePasswordModal()">Cancel</button>
          </div>
        </div>
      </div>

    </form>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      Auth.requireLoggedIn();
      loadAccountSettings();
    });

    function loadAccountSettings() {
      const userId = Auth.getUserId();
      fetch('/api/account/' + userId)
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => {
          const [firstName, ...rest] = (data.name || '').split(' ');
          if (data.tutorId && data.isTutor) {
            Auth.setTutorId(data.tutorId);
          } else {
            Auth.setTutorId(null);
          }
          populateAccountSettings({
            firstName:       firstName || '',
            lastName:        rest.join(' '),
            email:           data.email || '',
            gradeLevel:      data.gradeLevel,
            hasTutor:        !!data.tutorId,
            profilePhotoUrl: data.profilePic
          });
        })
        .catch(() => showAlert('error', 'Could not load your account data.'));
    }

    function populateAccountSettings(user) {
      document.getElementById('first-name').value = user.firstName || '';
      document.getElementById('last-name').value  = user.lastName  || '';
      document.getElementById('email').value       = user.email    || '';

      if (user.gradeLevel) {
        document.getElementById('grade-level').value = user.gradeLevel;
      }
      if (user.profilePhotoUrl) {
        document.getElementById('profile-pic-url').value = user.profilePhotoUrl;
        document.getElementById('avatar-preview').src = user.profilePhotoUrl;
      }

      document.getElementById('home-link').href = 'student-home.html';
    }

    function updateAvatarPreview() {
      const url = document.getElementById('profile-pic-url').value.trim();
      const preview = document.getElementById('avatar-preview');
      if (url) {
        preview.src = url;
        preview.style.display = 'block';
        preview.nextElementSibling.style.display = 'none';
      }
    }

    document.getElementById('account-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const newPw  = document.getElementById('new-password').value;
      const confPw = document.getElementById('confirm-password').value;
      if (newPw && newPw !== confPw) {
        showAlert('error', 'New passwords do not match.');
        return;
      }

      const userId    = Auth.getUserId();
      const firstName = document.getElementById('first-name').value.trim();
      const lastName  = document.getElementById('last-name').value.trim();
      const email     = document.getElementById('email').value.trim();
      const gradeLevel = document.getElementById('grade-level').value;

      const payload = {
        userId,
        firstName,
        lastName,
        email,
        gradeLevel: gradeLevel ? parseInt(gradeLevel, 10) : null,
        profilePicUrl: document.getElementById('profile-pic-url').value.trim() || null,
        currentPassword: document.getElementById('current-password').value || null,
        newPassword:     newPw || null
      };

      const btn = document.querySelector('button[type="submit"]');
      btn.disabled = true;

      fetch('/api/account/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(r => {
          if (r.ok) {
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value     = '';
            document.getElementById('confirm-password').value = '';
            showAlert('success', 'Changes saved successfully.');
          } else {
            return r.text().then(msg => Promise.reject(msg));
          }
        })
        .catch(msg => {
          const text = (typeof msg === 'string' && msg) ? msg : 'Something went wrong. Please try again.';
          showAlert('error', text);
        })
        .finally(() => { btn.disabled = false; });
    });

    function showAlert(type, msg) {
      document.getElementById('alert-success').style.display = 'none';
      document.getElementById('alert-error').style.display   = 'none';
      if (type === 'success') {
        document.getElementById('alert-success').textContent   = msg || 'Changes saved successfully.';
        document.getElementById('alert-success').style.display = 'block';
      } else {
        document.getElementById('alert-error').textContent   = msg || 'Something went wrong. Please try again.';
        document.getElementById('alert-error').style.display = 'block';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openPasswordModal() {
      document.getElementById('password-modal').classList.add('open');
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.remove('open');
    }

    function confirmDeleteAccount() {
      if (!confirm('Delete your account and all linked data? This cannot be undone.')) return;
      const userId = Auth.getUserId();
      fetch('/api/account/' + userId, { method: 'DELETE' })
        .then(r => {
          if (r.ok) {
            Auth.signOut();
            window.location.href = 'login.html';
          } else {
            return r.text().then(msg => Promise.reject(msg));
          }
        })
        .catch(msg => showAlert('error', typeof msg === 'string' ? msg : 'Could not delete account.'));
    }
  </script>

</body>
</html>
